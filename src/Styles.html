<style>
:root{--navy:#132a46;--blue:#1c5d99;--gold:#c99a2e;--bg:#f4f6f8;--card:#fff;--text:#1d2939;--muted:#667085;--border:#d9dee6;--danger:#b42318;--shadow:0 10px 30px rgba(19,42,70,.09)}
*{box-sizing:border-box}[hidden]{display:none!important}body{margin:0;font:15px/1.5 Arial,sans-serif;background:var(--bg);color:var(--text)}button,input,select,textarea{font:inherit}button{border:0;border-radius:8px;padding:.7rem 1rem;background:var(--navy);color:#fff;cursor:pointer}button:disabled{opacity:.55;cursor:wait}.loading{position:fixed;inset:0;display:grid;place-items:center;background:var(--bg);z-index:10}.login-shell{min-height:100vh;display:grid;place-items:center;padding:24px;background:linear-gradient(145deg,#0c2038,#1d527c)}.login-card{width:min(470px,100%);background:#fff;padding:42px;border-radius:18px;box-shadow:0 24px 70px rgba(0,0,0,.25)}.brand-mark{display:inline-grid;place-items:center;width:64px;height:64px;border-radius:16px;background:var(--navy);color:#fff;font-weight:800;letter-spacing:.08em;border-bottom:5px solid var(--gold)}h1,h2,p{margin-top:0}.eyebrow{text-transform:uppercase;letter-spacing:.08em;font-size:.75rem;font-weight:700;color:var(--blue);margin-top:18px}.google-button{margin-top:28px;min-height:44px}.error{color:var(--danger);font-size:.9rem}.topbar{min-height:68px;background:var(--navy);color:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 max(24px,calc((100vw - 1180px)/2));gap:20px}.topbar strong{margin-right:16px;letter-spacing:.08em}.topbar span{opacity:.9}.user-area{display:flex;align-items:center;gap:10px}.role{font-size:.72rem;background:rgba(255,255,255,.14);padding:4px 8px;border-radius:99px}.link-button{background:transparent;text-decoration:underline;padding:.4rem}.container{max-width:1180px;margin:auto;padding:34px 24px}.hero{display:flex;justify-content:space-between;gap:20px;align-items:start}.hero .eyebrow{margin-top:0}.hero h1{font-size:clamp(1.65rem,3vw,2.4rem);margin-bottom:8px}.secondary{background:#fff;color:var(--navy);border:1px solid var(--border)}.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin:28px 0}.metric{background:#fff;border:1px solid var(--border);padding:20px;border-radius:12px}.metric strong{font-size:1.8rem;display:block;color:var(--navy)}.metric span{color:var(--muted)}.tabs{display:flex;gap:8px;border-bottom:1px solid var(--border);margin-bottom:20px}.tab{background:transparent;color:var(--muted);border-radius:0;border-bottom:3px solid transparent}.tab.active{color:var(--navy);border-color:var(--gold)}.toolbar{display:flex;gap:12px;margin-bottom:18px}.toolbar input{flex:1}.toolbar input,.toolbar select,label select,label textarea{border:1px solid var(--border);border-radius:8px;padding:.72rem;background:#fff}.cards{display:grid;gap:12px}.request-card,.judge-card{background:#fff;border:1px solid var(--border);border-radius:12px;padding:20px;box-shadow:var(--shadow)}.request-head{display:flex;align-items:start;justify-content:space-between;gap:16px}.request-head h3{margin:0}.meta{color:var(--muted);font-size:.9rem}.badge{white-space:nowrap;border-radius:99px;padding:5px 10px;background:#eef4fb;color:#244f76;font-size:.8rem;font-weight:700}.details{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:18px 0}.details div{min-width:0}.details small{display:block;color:var(--muted)}.card-actions{display:flex;justify-content:flex-end}.empty{text-align:center;color:var(--muted);background:#fff;padding:40px;border-radius:12px;border:1px dashed var(--border)}dialog{width:min(620px,calc(100% - 28px));border:0;border-radius:14px;padding:0;box-shadow:0 30px 80px rgba(0,0,0,.25)}dialog::backdrop{background:rgba(13,30,49,.58)}dialog form{padding:24px}.dialog-head,.dialog-actions{display:flex;align-items:center;justify-content:space-between;gap:12px}.icon-button{background:transparent;color:var(--muted);font-size:1.7rem;padding:0 8px}label{display:grid;gap:6px;margin:16px 0;font-weight:700}.dialog-actions{justify-content:flex-end;margin-top:20px}.toast{position:fixed;right:22px;bottom:22px;background:#173e2a;color:#fff;padding:12px 18px;border-radius:9px;box-shadow:var(--shadow)}

</style>
