<style>
:root{--navy:#132a46;--blue:#1c5d99;--gold:#c99a2e;--bg:#f4f6f8;--card:#fff;--text:#1d2939;--muted:#667085;--border:#d9dee6;--danger:#b42318;--success:#176b45;--warning:#9a6700;--shadow:0 10px 30px rgba(19,42,70,.09)}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;font:15px/1.5 Arial,sans-serif;background:var(--bg);color:var(--text)}
button,input,select,textarea{font:inherit}
button{border:0;border-radius:8px;padding:.72rem 1rem;background:var(--navy);color:#fff;cursor:pointer;font-weight:700}
button:hover{filter:brightness(1.08)}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,summary:focus-visible{outline:3px solid rgba(28,93,153,.28);outline-offset:2px}
button:disabled{opacity:.55;cursor:wait}
h1,h2,h3,p{margin-top:0}
.loading{position:fixed;inset:0;display:grid;place-items:center;background:var(--bg);z-index:10;font-weight:700;color:var(--navy)}
.login-shell{min-height:100vh;display:grid;place-items:center;padding:24px;background:linear-gradient(145deg,#0c2038,#1d527c)}
.login-card{width:min(470px,100%);background:#fff;padding:42px;border-radius:18px;box-shadow:0 24px 70px rgba(0,0,0,.25)}
.brand-mark{display:inline-grid;place-items:center;width:64px;height:64px;border-radius:16px;background:var(--navy);color:#fff;font-weight:800;letter-spacing:.08em;border-bottom:5px solid var(--gold)}
.eyebrow,.record-label{text-transform:uppercase;letter-spacing:.08em;font-size:.75rem;font-weight:700;color:var(--blue);margin:0 0 6px}
.error{color:var(--danger);font-size:.9rem;margin-top:14px}
.topbar{min-height:72px;background:var(--navy);color:#fff;display:flex;align-items:center;justify-content:space-between;padding:10px max(24px,calc((100vw - 1180px)/2));gap:20px}
.brand-title strong{margin-right:16px;letter-spacing:.08em}.brand-title span{opacity:.9}
.user-area{display:flex;align-items:center;gap:12px}.user-copy{display:grid;text-align:right;line-height:1.25}.user-copy small{opacity:.75}
.role{font-size:.72rem;background:rgba(255,255,255,.14);padding:4px 8px;border-radius:99px}.link-button{background:transparent;text-decoration:underline;padding:.4rem}
.container{max-width:1180px;margin:auto;padding:34px 24px 52px}
.hero{display:flex;justify-content:space-between;gap:24px;align-items:start}.hero h1{font-size:clamp(1.65rem,3vw,2.4rem);margin-bottom:8px}.hero-actions{display:flex;gap:10px;flex-wrap:wrap}
.secondary{background:#fff;color:var(--navy);border:1px solid var(--border)}
.notice{margin-top:22px;padding:15px 18px;border-left:4px solid var(--blue);border-radius:8px;background:#eaf2fa;color:#173f66}.notice strong{display:block}
.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin:26px 0}
.metric{background:#fff;border:1px solid var(--border);padding:18px;border-radius:12px}.metric strong{font-size:1.8rem;display:block;color:var(--navy)}.metric span{display:block;font-weight:700}.metric small{color:var(--muted)}
.tabs{display:flex;gap:6px;border-bottom:1px solid var(--border);margin-bottom:24px;overflow-x:auto}.tab{background:transparent;color:var(--muted);border-radius:0;border-bottom:3px solid transparent;white-space:nowrap}.tab.active{color:var(--navy);border-color:var(--gold)}
.section-heading{display:flex;justify-content:space-between;align-items:end;margin-bottom:18px}.section-heading h2{margin-bottom:3px}.section-heading p{color:var(--muted);margin-bottom:0}
.toolbar{display:flex;gap:12px;margin-bottom:18px;align-items:stretch}.toolbar input{flex:1 1 720px;min-width:0;min-height:50px;padding:0 16px;font-size:1rem}.toolbar select{flex:0 0 230px;min-height:50px}.toolbar input,.toolbar select,.dialog-section select,.dialog-section textarea{border:1px solid var(--border);border-radius:8px;padding:.75rem;background:#fff;width:100%}
.cards{display:grid;gap:14px}.request-card,.judge-card,.tutorial-card,.help-section{background:#fff;border:1px solid var(--border);border-radius:12px;padding:20px;box-shadow:var(--shadow)}
.request-head{display:flex;align-items:start;justify-content:space-between;gap:16px}.request-head h3{margin:0}.meta{color:var(--muted);font-size:.9rem;margin-top:4px}
.badge{white-space:nowrap;border-radius:99px;padding:5px 10px;background:#eef4fb;color:#244f76;font-size:.8rem;font-weight:700;display:inline-block}.status-pendente{background:#fff4d6;color:#805500}.status-em-atendimento{background:#e5f0ff;color:#174e8c}.status-concluido{background:#e6f6ed;color:#176b45}.status-cancelado{background:#fce8e6;color:#a1281d}
.details{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin:18px 0}.details div{min-width:0;overflow-wrap:anywhere}.details small{display:block;color:var(--muted);margin-bottom:2px}.details strong{font-weight:700}
.request-extra{border-top:1px solid var(--border);padding-top:12px;margin-top:8px}.request-extra summary{cursor:pointer;color:var(--blue);font-weight:700}.extra-details{grid-template-columns:repeat(2,1fr);margin-bottom:4px}
.card-actions{display:flex;justify-content:flex-end;margin-top:16px}.empty{text-align:center;color:var(--muted);background:#fff;padding:40px;border-radius:12px;border:1px dashed var(--border);display:grid;gap:4px}.empty strong{color:var(--text)}
.tutorial-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}.tutorial-card{position:relative;padding-left:72px}.tutorial-card h3{margin-bottom:6px}.tutorial-card p{margin:0;color:var(--muted)}
.step-number{display:inline-grid;place-items:center;min-width:34px;height:34px;border-radius:50%;background:var(--navy);color:#fff;font-weight:800}.tutorial-card>.step-number{position:absolute;left:20px;top:20px}
.help-section{margin-top:16px}.help-section h3{margin-bottom:14px}.help-section ul{margin:0;padding-left:20px}.help-section li+li{margin-top:8px}
.status-guide{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.status-guide>div{border:1px solid var(--border);border-radius:9px;padding:14px}.status-guide p{margin:9px 0 0;color:var(--muted);font-size:.9rem}
dialog{width:min(700px,calc(100% - 28px));max-height:calc(100vh - 28px);border:0;border-radius:14px;padding:0;box-shadow:0 30px 80px rgba(0,0,0,.25)}dialog::backdrop{background:rgba(13,30,49,.58)}dialog form{padding:24px}
.dialog-head,.dialog-actions{display:flex;align-items:center;justify-content:space-between;gap:12px}.dialog-head h2{margin-bottom:0}.icon-button{background:transparent;color:var(--muted);font-size:1.7rem;padding:0 8px}.dialog-summary{color:var(--muted);padding-bottom:14px;border-bottom:1px solid var(--border)}
.dialog-section{background:#f8fafc;border:1px solid var(--border);border-radius:12px;padding:18px;margin:16px 0}.dialog-section label{display:block;margin:14px 0 6px;font-weight:700}.action-heading{display:flex;align-items:start;gap:12px}.action-heading h3{margin-bottom:2px}.action-heading p{margin:0;color:var(--muted)}.help-text{font-size:.87rem;color:var(--muted);margin:8px 0 14px}.dialog-section>button{width:100%}.dialog-actions{justify-content:flex-end;margin-top:18px}
.toast{position:fixed;right:22px;bottom:22px;background:#173e2a;color:#fff;padding:12px 18px;border-radius:9px;box-shadow:var(--shadow);z-index:20}.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
@media(max-width:760px){.topbar{padding:12px 18px;align-items:flex-start}.brand-title span,.user-copy small{display:none}.user-area{flex-wrap:wrap;justify-content:flex-end}.container{padding:24px 16px}.hero{display:block}.hero-actions{margin-top:14px}.metrics{grid-template-columns:repeat(2,1fr)}.toolbar{display:grid}.details,.extra-details{grid-template-columns:1fr}.request-head{display:block}.request-head>.badge{margin-top:10px}.tutorial-grid,.status-guide{grid-template-columns:1fr}.tutorial-card{padding-left:68px}.dialog-section{padding:15px}}
</style>
