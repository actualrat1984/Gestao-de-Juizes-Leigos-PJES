<script>
const state={token:sessionStorage.getItem('jl_session')||'',data:null,config:null};
const $=id=>document.getElementById(id);
function server(name,...args){return new Promise((resolve,reject)=>{let settled=false;const timer=setTimeout(()=>{if(!settled){settled=true;reject(new Error('O Apps Script não respondeu em 15 segundos. Verifique se o Web App foi implantado e se o proprietário autorizou o projeto.'));}},15000);const ok=value=>{if(settled)return;settled=true;clearTimeout(timer);resolve(value)};const fail=error=>{if(settled)return;settled=true;clearTimeout(timer);reject(new Error(error&&error.message||String(error)))};try{google.script.run.withSuccessHandler(ok).withFailureHandler(fail)[name](...args)}catch(error){fail(error)}});}
function esc(value){const d=document.createElement('div');d.textContent=value==null?'':String(value);return d.innerHTML;}
function toast(message){$('toast').textContent=message;$('toast').hidden=false;setTimeout(()=>$('toast').hidden=true,2600);}
function showLogin(message=''){$('loading').hidden=true;$('app').hidden=true;$('login').hidden=false;$('loginError').textContent=message;renderGoogleButton();}
function renderGoogleButton(){if(!state.config)return; if(!state.config.oauthClientId){$('googleButton').innerHTML='';return;} if(!window.google){if(!state.gisWaitStarted){state.gisWaitStarted=Date.now();}if(Date.now()-state.gisWaitStarted<10000)return setTimeout(renderGoogleButton,120);$('loginError').textContent='O componente de login do Google não carregou. Recarregue a página ou verifique se o navegador bloqueou accounts.google.com.';return;}google.accounts.id.initialize({client_id:state.config.oauthClientId,callback:onGoogleCredential,hd:state.config.dominio,auto_select:false});google.accounts.id.renderButton($('googleButton'),{theme:'outline',size:'large',text:'signin_with',shape:'rectangular',width:330});}
async function onGoogleCredential(response){try{$('loginError').textContent='Validando acesso…';const result=await server('apiLogin',response.credential);state.token=result.token;sessionStorage.setItem('jl_session',state.token);await loadData();}catch(error){showLogin(error.message);}}
async function boot(){try{state.config=await server('apiConfiguracaoPublica');if(!state.config.oauthClientId){showLogin('Configuração incompleta: cadastre GOOGLE_OAUTH_CLIENT_ID nas propriedades do script.');return;}if(state.token){try{return await loadData();}catch(e){sessionStorage.removeItem('jl_session');state.token='';}}showLogin();}catch(error){showLogin('Não foi possível iniciar o sistema: '+error.message);}}
async function loadData(){try{$('loading').hidden=false;state.data=await server('apiBootstrap',state.token);render();$('login').hidden=true;$('app').hidden=false;$('loading').hidden=true;}catch(error){$('loading').hidden=true;if(/Sessão/.test(error.message))return showLogin(error.message);toast(error.message);throw error;}}
function render(){const d=state.data;$('userName').textContent=d.usuario.nome;$('userRole').textContent=d.usuario.perfil;$('scopeText').textContent=d.permissoes.gerenciar?'Você possui visão gerencial de todas as solicitações.':'Você visualiza apenas as solicitações feitas pelo seu e-mail institucional.';$('metrics').innerHTML=[['Total',d.metricas.total],['Pendentes',d.metricas.pendentes],['Em atendimento',d.metricas.emAtendimento],['Juízes disponíveis',d.metricas.disponiveis]].map(([l,v])=>`<div class="metric"><strong>${v}</strong><span>${l}</span></div>`).join('');$('statusFilter').innerHTML='<option value="">Todos os status</option>'+d.statusPermitidos.map(x=>`<option>${esc(x)}</option>`).join('');$('editStatus').innerHTML=d.statusPermitidos.map(x=>`<option>${esc(x)}</option>`).join('');$('editJudge').innerHTML='<option value="">Selecione</option>'+d.juizes.map(x=>`<option>${esc(x.nome)}</option>`).join('');$('assignButton').hidden=!d.permissoes.gerenciar;$('saveButton').hidden=!d.permissoes.gerenciar;renderRequests();renderJudges();}
function renderRequests(){const term=$('search').value.toLowerCase(),status=$('statusFilter').value;const rows=state.data.solicitacoes.filter(r=>(!status||r.status===status)&&JSON.stringify(r).toLowerCase().includes(term));$('requests').innerHTML=rows.length?rows.map(r=>`<article class="request-card"><div class="request-head"><div><h3>${esc(r.unidade||'Unidade não informada')}</h3><div class="meta">Solicitante: ${esc(r.solicitante||'—')} · Registro #${r.id}</div></div><span class="badge">${esc(r.status)}</span></div><div class="details"><div><small>Quantidade</small>${esc(r.quantidade||'—')}</div><div><small>Juiz designado</small>${esc(r.juiz||'Não designado')}</div><div><small>Competências</small>${esc(r.competencias||'—')}</div></div>${state.data.permissoes.gerenciar?`<div class="card-actions"><button onclick="openEdit(${r.id})">Gerenciar</button></div>`:''}</article>`).join(''):'<div class="empty">Nenhuma solicitação encontrada.</div>';}
function renderJudges(){const rows=state.data.juizes;$('judges').innerHTML=rows.length?rows.map(j=>`<article class="judge-card"><div class="request-head"><h3>${esc(j.nome)}</h3><span class="badge">Capacidade: ${esc(j.capacidade||'—')}</span></div><div class="details"><div><small>Matérias</small>${esc(j.materias||'—')}</div><div><small>Observações</small>${esc(j.observacoes||'—')}</div>${j.contato?`<div><small>Contato</small>${esc(j.contato.email||'—')}<br>${esc(j.contato.telefone||'')}</div>`:''}</div></article>`).join(''):'<div class="empty">Nenhum juiz disponível no momento.</div>';}
function openEdit(id){const r=state.data.solicitacoes.find(x=>x.id===id);$('editId').value=id;$('editJudge').value=r.juiz||'';$('editStatus').value=r.status;$('editNotes').value=r.observacoes||'';$('editError').textContent='';$('editDialog').showModal();}
async function busy(button,fn){button.disabled=true;try{await fn();}catch(error){$('editError').textContent=error.message;}finally{button.disabled=false;}}
$('assignButton').onclick=()=>busy($('assignButton'),async()=>{const judge=$('editJudge').value;if(!judge)throw new Error('Selecione uma juíza ou um juiz.');await server('apiDesignarJuiz',state.token,Number($('editId').value),judge);$('editDialog').close();toast('Designação registrada.');await loadData();});
$('saveButton').onclick=()=>busy($('saveButton'),async()=>{await server('apiAtualizarSolicitacao',state.token,Number($('editId').value),$('editStatus').value,$('editNotes').value);$('editDialog').close();toast('Solicitação atualizada.');await loadData();});
async function logout(){try{await server('apiLogout',state.token);}finally{sessionStorage.removeItem('jl_session');state.token='';showLogin();}}
$('search').addEventListener('input',renderRequests);$('statusFilter').addEventListener('change',renderRequests);document.querySelectorAll('.tab').forEach(button=>button.onclick=()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x===button));$('requestsPanel').hidden=button.dataset.tab!=='requests';$('judgesPanel').hidden=button.dataset.tab!=='judges';});
boot();
</script>
