<script>
const state={token:sessionStorage.getItem('jl_session')||'',data:null,config:null};
const $=id=>document.getElementById(id);

function server(name,...args){
  return new Promise((resolve,reject)=>{
    let settled=false;
    const timer=setTimeout(()=>{
      if(!settled){
        settled=true;
        reject(new Error('O Apps Script não respondeu em 15 segundos. Verifique a implantação e as permissões do navegador.'));
      }
    },15000);
    const ok=value=>{if(settled)return;settled=true;clearTimeout(timer);resolve(value);};
    const fail=error=>{if(settled)return;settled=true;clearTimeout(timer);reject(new Error(error&&error.message||String(error)));};
    try{google.script.run.withSuccessHandler(ok).withFailureHandler(fail)[name](...args);}catch(error){fail(error);}
  });
}

function esc(value){const d=document.createElement('div');d.textContent=value==null?'':String(value);return d.innerHTML;}
function toast(message){$('toast').textContent=message;$('toast').hidden=false;setTimeout(()=>$('toast').hidden=true,3000);}
function showLogin(message=''){$('loading').hidden=true;$('app').hidden=true;$('login').hidden=false;$('loginError').textContent=message;}

function statusClass(status){
  const normalized=String(status||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/\s+/g,'-');
  return 'status-'+normalized;
}

async function boot(){
  $('loading').hidden=false;
  $('login').hidden=true;
  $('app').hidden=true;
  try{
    state.config=await server('apiConfiguracaoPublica');
    if(state.token){
      try{return await loadData();}
      catch(error){sessionStorage.removeItem('jl_session');state.token='';}
    }
    $('loginError').textContent='Identificando sua conta institucional…';
    const result=await server('apiLogin');
    state.token=result.token;
    sessionStorage.setItem('jl_session',state.token);
    await loadData();
  }catch(error){showLogin(error.message||'Não foi possível identificar a conta institucional.');}
}

async function loadData(){
  try{
    $('loading').hidden=false;
    state.data=await server('apiBootstrap',state.token);
    render();
    $('login').hidden=true;
    $('app').hidden=false;
    $('loading').hidden=true;
  }catch(error){
    $('loading').hidden=true;
    if(/Sessão|acesso revogado/.test(error.message))return showLogin(error.message);
    toast(error.message);
    throw error;
  }
}

function render(){
  const d=state.data;
  $('userName').textContent=d.usuario.nome||'Usuário';
  $('userEmail').textContent=d.usuario.email||'';
  $('userRole').textContent=d.usuario.perfil;
  $('scopeText').textContent=d.permissoes.gerenciar
    ?'Você visualiza todas as solicitações e pode realizar designações e atualizações.'
    :'Você possui acesso de consulta e visualiza somente as solicitações vinculadas ao seu e-mail.';
  $('managementNotice').hidden=!d.permissoes.gerenciar;

  const metrics=[
    ['Total',d.metricas.total,'Solicitações visíveis'],
    ['Pendentes',d.metricas.pendentes,'Aguardando início'],
    ['Em atendimento',d.metricas.emAtendimento,'Em andamento'],
    ['Juízes disponíveis',d.metricas.disponiveis,'Registros ativos']
  ];
  $('metrics').innerHTML=metrics.map(([label,value,description])=>`<div class="metric"><strong>${value}</strong><span>${label}</span><small>${description}</small></div>`).join('');
  $('statusFilter').innerHTML='<option value="">Todos os status</option>'+d.statusPermitidos.map(x=>`<option>${esc(x)}</option>`).join('');
  $('editStatus').innerHTML=d.statusPermitidos.map(x=>`<option>${esc(x)}</option>`).join('');
  $('editJudge').innerHTML='<option value="">Selecione uma pessoa</option>'+d.juizes.map(x=>`<option>${esc(x.nome)}</option>`).join('');
  $('assignButton').hidden=!d.permissoes.gerenciar;
  $('saveButton').hidden=!d.permissoes.gerenciar;
  renderRequests();
  renderJudges();
}

function requestExtra(r){
  if(!r.detalhes)return '';
  const d=r.detalhes;
  return `<details class="request-extra"><summary>Ver informações complementares</summary><div class="details extra-details"><div><small>E-mail</small>${esc(d.email||'—')}</div><div><small>Telefone</small>${esc(d.telefone||'—')}</div><div><small>Processos</small>${esc(d.processos||'—')}</div><div><small>Orientações</small>${esc(d.orientacoes||'—')}</div><div><small>Produtividade</small>${esc(d.produtividade||'—')}</div><div><small>Preferência indicada</small>${esc(r.preferencia||'—')}</div></div></details>`;
}

function renderRequests(){
  const term=$('search').value.toLowerCase();
  const status=$('statusFilter').value;
  const rows=state.data.solicitacoes.filter(r=>(!status||r.status===status)&&JSON.stringify(r).toLowerCase().includes(term));
  $('requests').innerHTML=rows.length?rows.map(r=>`
    <article class="request-card">
      <div class="request-head">
        <div><p class="record-label">Solicitação #${r.id}</p><h3>${esc(r.unidade||'Unidade não informada')}</h3><div class="meta">Enviada por ${esc(r.solicitante||'Solicitante não informado')}${r.data?' · '+esc(r.data):''}</div></div>
        <span class="badge ${statusClass(r.status)}">${esc(r.status)}</span>
      </div>
      <div class="details">
        <div><small>Quantidade solicitada</small><strong>${esc(r.quantidade||'—')}</strong></div>
        <div><small>Responsável designado</small><strong>${esc(r.juiz||'Ainda não designado')}</strong></div>
        <div><small>Competências ou matérias</small>${esc(r.competencias||'Não informadas')}</div>
      </div>
      ${requestExtra(r)}
      ${state.data.permissoes.gerenciar?`<div class="card-actions"><button type="button" onclick="openEdit(${r.id})">Abrir gestão</button></div>`:''}
    </article>`).join(''):'<div class="empty"><strong>Nenhuma solicitação encontrada.</strong><span>Tente remover os filtros ou pesquisar outro termo.</span></div>';
}

function renderJudges(){
  const rows=state.data.juizes;
  $('judges').innerHTML=rows.length?rows.map(j=>`
    <article class="judge-card">
      <div class="request-head"><div><p class="record-label">Disponibilidade #${j.id}</p><h3>${esc(j.nome||'Nome não informado')}</h3></div><span class="badge">Capacidade: ${esc(j.capacidade||'—')}</span></div>
      <div class="details"><div><small>Matérias</small>${esc(j.materias||'Não informadas')}</div><div><small>Observações</small>${esc(j.observacoes||'Nenhuma')}</div>${j.contato?`<div><small>Contato</small>${esc(j.contato.email||'—')}<br>${esc(j.contato.telefone||'')}</div>`:''}</div>
    </article>`).join(''):'<div class="empty"><strong>Nenhum juiz disponível no momento.</strong><span>Confira os registros e status na planilha vinculada.</span></div>';
}

function openEdit(id){
  const r=state.data.solicitacoes.find(x=>x.id===id);
  if(!r)return toast('Solicitação não encontrada. Atualize os dados e tente novamente.');
  $('editId').value=id;
  $('editRequestRef').textContent='#'+id;
  $('editRequestSummary').textContent=(r.unidade||'Unidade não informada')+' · '+(r.solicitante||'Solicitante não informado');
  if(r.juiz&&!Array.from($('editJudge').options).some(option=>option.value===r.juiz)){
    $('editJudge').add(new Option(r.juiz,r.juiz));
  }
  $('editJudge').value=r.juiz||'';
  $('editStatus').value=r.status;
  $('editNotes').value=r.observacoes||'';
  $('editError').textContent='';
  $('editDialog').showModal();
}

async function busy(button,fn){
  button.disabled=true;
  $('editError').textContent='';
  try{await fn();}catch(error){$('editError').textContent=error.message;}finally{button.disabled=false;}
}

$('assignButton').onclick=()=>busy($('assignButton'),async()=>{
  const judge=$('editJudge').value;
  if(!judge)throw new Error('Selecione uma juíza ou um juiz antes de confirmar.');
  if(!window.confirm(`Designar ${judge} e mudar o status para “Em atendimento”?`))return;
  await server('apiDesignarJuiz',state.token,Number($('editId').value),judge);
  $('editDialog').close();
  toast('Juiz designado e atendimento iniciado.');
  await loadData();
});

$('saveButton').onclick=()=>busy($('saveButton'),async()=>{
  await server('apiAtualizarSolicitacao',state.token,Number($('editId').value),$('editStatus').value,$('editNotes').value);
  $('editDialog').close();
  toast('Status e observações atualizados.');
  await loadData();
});

function setActiveTab(tabName){
  const panels={requests:'requestsPanel',judges:'judgesPanel',tutorial:'tutorialPanel'};
  if(!panels[tabName])return;
  document.querySelectorAll('.tab').forEach(button=>button.classList.toggle('active',button.dataset.tab===tabName));
  Object.entries(panels).forEach(([name,id])=>$(id).hidden=name!==tabName);
  window.scrollTo({top:0,behavior:'smooth'});
}

async function logout(){
  try{await server('apiLogout',state.token);}
  finally{sessionStorage.removeItem('jl_session');state.token='';showLogin();}
}

$('search').addEventListener('input',renderRequests);
$('statusFilter').addEventListener('change',renderRequests);
document.querySelectorAll('.tab').forEach(button=>button.onclick=()=>setActiveTab(button.dataset.tab));
boot();
</script>
